      <text id="stat-elemental-bonus-label" x="430" y="460" data-anchor="start" data-size="13" data-max-width="150" data-min-size="9" data-weight="400"/>
      <text id="stat-elemental-bonus" x="825" y="460" data-anchor="end" data-size="17" data-max-width="150" data-min-size="10" data-weight="600"/>
    </g>

