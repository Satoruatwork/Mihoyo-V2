<?xml version="1.0" encoding="UTF-8"?>
<!--
  Character card layout — the single machine-readable source of truth for geometry.

  viewBox is the template's NATIVE 1280x720 pixel space, so every coordinate here is a
  direct measurement off the master template / approved reference. width/height render it
  out at the required 1536x864 (exactly 1.2x), which keeps text and icons crisp without
  forcing the measurements into a rescaled coordinate system.

  static-layer  : never changes. The base template image.
  dynamic-layer : slots only. Every element carries an id plus its geometry; the renderer
                  reads these and never invents a position. Slot elements are invisible
                  geometry carriers (fill="none") — the renderer draws the real content.

  Text slots use: x, y, data-anchor (start|middle|end), data-size, data-max-width,
                  data-min-size, data-weight.
  Image slots use: x, y, width, height, data-fit (contain|cover), data-clip (rect|circle).
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1536" height="864" viewBox="0 0 1280 720">

  <g id="static-layer">
    <image id="template-base" x="0" y="0" width="1280" height="720"
           xlink:href="character_card_base.jpg" preserveAspectRatio="none"/>
  </g>

  <g id="dynamic-layer">
    <g id="character-slot">
      <rect id="character-image" x="158" y="116" width="186" height="480" fill="none" data-fit="cover" data-clip="stadium"/>
      <text id="character-name" x="118" y="33" data-anchor="start" data-size="42" data-max-width="262" data-min-size="10" data-weight="600"/>
      <text id="character-rarity" x="120" y="74" data-anchor="start" data-size="20" data-max-width="140" data-min-size="10" data-weight="400"/>
      <text id="character-title" x="120" y="96" data-anchor="start" data-size="18" data-max-width="230" data-min-size="10" data-weight="400"/>
      <text id="character-level" x="450" y="62" data-anchor="middle" data-size="22" data-max-width="80" data-min-size="10" data-weight="600"/>
      <text id="character-constellation" x="603" y="66" data-anchor="middle" data-size="20" data-max-width="40" data-min-size="10" data-weight="700"/>
      <text id="character-rarity-bar" x="770" y="66" data-anchor="middle" data-size="18" data-max-width="120" data-min-size="10" data-weight="400"/>
      <text id="character-friendship" x="128" y="561" data-anchor="start" data-size="16" data-max-width="60" data-min-size="10" data-weight="400"/>
    </g>

    <g id="weapon-slot">
      <rect id="weapon-image" x="406" y="129" width="78" height="78" fill="none" data-fit="contain" data-clip="circle"/>
      <text id="weapon-name" x="525" y="138" data-anchor="start" data-size="19" data-max-width="300" data-min-size="10" data-weight="600"/>
      <text id="weapon-rarity" x="445" y="226" data-anchor="middle" data-size="13" data-max-width="90" data-min-size="10" data-weight="400"/>
      <text id="weapon-base-attack" x="565" y="174" data-anchor="start" data-size="17" data-max-width="70" data-min-size="10" data-weight="600"/>
      <text id="weapon-secondary-stat" x="672" y="174" data-anchor="start" data-size="17" data-max-width="80" data-min-size="10" data-weight="600"/>
      <text id="weapon-level" x="533" y="213" data-anchor="start" data-size="15" data-max-width="150" data-min-size="10" data-weight="400"/>
      <text id="weapon-refinement" x="818" y="177" data-anchor="middle" data-size="17" data-max-width="34" data-min-size="10" data-weight="700"/>
    </g>

    <g id="stats-slot">
      <text id="stat-hp" x="825" y="287" data-anchor="end" data-size="17" data-max-width="150" data-min-size="10" data-weight="600"/>
      <text id="stat-atk" x="825" y="312" data-anchor="end" data-size="17" data-max-width="150" data-min-size="10" data-weight="600"/>
      <text id="stat-def" x="825" y="337" data-anchor="end" data-size="17" data-max-width="150" data-min-size="10" data-weight="600"/>
